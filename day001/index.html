<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 001 — じゃんけんアプリ</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-7JYG0E25PG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-7JYG0E25PG');
</script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #d6f5ed;
    --bg2: #b8edd e;
    --card: #ffffff;
    --mint: #3ecfaa;
    --mint-light: #e8faf5;
    --mint-dark: #2ab394;
    --coral: #ff7f7f;
    --yellow: #ffd166;
    --purple: #c084fc;
    --text: #2d4a42;
    --muted: #8abcb0;
    --shadow: rgba(62, 207, 170, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(160deg, #c8f5e8 0%, #d8f0ff 100%);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  /* デコレーション */
  .deco {
    position: fixed;
    border-radius: 50%;
    opacity: 0.25;
    pointer-events: none;
    z-index: 0;
  }
  .deco-1 { width: 180px; height: 180px; background: #3ecfaa; top: -60px; left: -60px; }
  .deco-2 { width: 120px; height: 120px; background: #ff7f7f; bottom: 40px; right: -40px; }
  .deco-3 { width: 80px;  height: 80px;  background: #ffd166; top: 30%;   right: 10px; }
  .deco-4 { width: 60px;  height: 60px;  background: #c084fc; bottom: 20%; left: 10px; }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 360px;
  }

  .day-label {
    text-align: center;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.2em;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  h1 {
    text-align: center;
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--text);
    margin-bottom: 24px;
  }

  /* キャラクターカード */
  .char-card {
    background: var(--card);
    border-radius: 32px;
    padding: 28px 24px 20px;
    box-shadow: 0 12px 40px var(--shadow);
    margin-bottom: 16px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .char-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, #3ecfaa, #7dd8c6, #c084fc);
    border-radius: 32px 32px 0 0;
  }

  /* キャラクター SVG */
  .character {
    width: 120px;
    height: 120px;
    margin: 0 auto 16px;
    transition: transform 0.3s;
  }

  .character.bounce {
    animation: bounce 0.5s ease;
  }
  .character.shake-lose {
    animation: shakeLose 0.5s ease;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-16px) scale(1.1); }
    60% { transform: translateY(-8px) scale(1.05); }
  }

  @keyframes shakeLose {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-8deg); }
    40% { transform: rotate(8deg); }
    60% { transform: rotate(-5deg); }
    80% { transform: rotate(5deg); }
  }

  .char-message {
    font-size: 1rem;
    font-weight: 800;
    color: var(--text);
    min-height: 28px;
    transition: all 0.3s;
  }

  .char-message.win  { color: #3ecfaa; }
  .char-message.lose { color: var(--coral); }
  .char-message.draw { color: #f59e0b; }

  /* スコア */
  .scoreboard {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  .score-item {
    flex: 1;
    background: var(--mint-light);
    border-radius: 16px;
    padding: 10px 4px;
    text-align: center;
  }

  .score-num {
    font-size: 1.6rem;
    font-weight: 900;
    line-height: 1;
  }

  .score-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    margin-top: 2px;
  }

  /* 対戦エリア */
  .battle-card {
    background: var(--card);
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 8px 24px var(--shadow);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-around;
  }

  .battle-side {
    text-align: center;
  }

  .battle-label {
    font-size: 10px;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }

  .battle-hand {
    font-size: 3.2rem;
    line-height: 1;
    transition: transform 0.2s;
  }

  .battle-hand.shake {
    animation: handShake 0.4s ease;
  }

  @keyframes handShake {
    0%, 100% { transform: translateY(0); }
    25% { transform: translateY(-10px) rotate(-5deg); }
    75% { transform: translateY(6px) rotate(3deg); }
  }

  .vs-badge {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, #3ecfaa, #7dd8c6);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 900;
    color: white;
  }

  /* 選択ボタン */
  .choices-card {
    background: var(--card);
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 8px 24px var(--shadow);
    margin-bottom: 12px;
  }

  .choices-label {
    font-size: 11px;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-align: center;
    margin-bottom: 14px;
  }

  .choices {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .choice-btn {
    flex: 1;
    aspect-ratio: 1;
    max-width: 90px;
    font-size: 2.2rem;
    background: var(--mint-light);
    border: 3px solid transparent;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .choice-btn span.label {
    font-size: 10px;
    font-weight: 800;
    color: var(--muted);
  }

  .choice-btn:hover {
    border-color: var(--mint);
    background: white;
    transform: translateY(-4px);
    box-shadow: 0 8px 20px var(--shadow);
  }

  .choice-btn:active {
    transform: translateY(0) scale(0.95);
  }

  /* リセット */
  .reset-btn {
    width: 100%;
    padding: 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 800;
    color: var(--muted);
    background: none;
    border: 2px dashed #c8ede6;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }

  .reset-btn:hover {
    color: var(--mint-dark);
    border-color: var(--mint);
    background: var(--mint-light);
  }
</style>
</head>
<body>

<!-- 背景デコ -->
<div class="deco deco-1"></div>
<div class="deco deco-2"></div>
<div class="deco deco-3"></div>
<div class="deco deco-4"></div>

<div class="wrapper">

  <div class="day-label">Day 001 — 100日アプリチャレンジ</div>
  <h1>じゃんけん 🌿</h1>

  <!-- キャラクターカード -->
  <div class="char-card">
    <svg class="character" id="char" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- 体 -->
      <ellipse cx="60" cy="85" rx="30" ry="22" fill="#3ecfaa"/>
      <!-- 頭 -->
      <circle cx="60" cy="52" r="32" fill="#3ecfaa"/>
      <!-- 耳（丸っこい） -->
      <circle cx="34" cy="28" r="10" fill="#3ecfaa"/>
      <circle cx="86" cy="28" r="10" fill="#3ecfaa"/>
      <!-- 耳内側 -->
      <circle cx="34" cy="28" r="6" fill="#7ddfc8"/>
      <circle cx="86" cy="28" r="6" fill="#7ddfc8"/>
      <!-- 顔白ぽい部分 -->
      <ellipse cx="60" cy="56" rx="22" ry="20" fill="#e8faf5"/>
      <!-- 目（白） -->
      <circle cx="50" cy="50" r="9" fill="white"/>
      <circle cx="70" cy="50" r="9" fill="white"/>
      <!-- 目（黒目） -->
      <circle id="eye-l" cx="51" cy="50" r="5" fill="#2d4a42"/>
      <circle id="eye-r" cx="71" cy="50" r="5" fill="#2d4a42"/>
      <!-- ハイライト -->
      <circle cx="53" cy="48" r="2" fill="white"/>
      <circle cx="73" cy="48" r="2" fill="white"/>
      <!-- 口（通常：にっこり） -->
      <path id="mouth" d="M52 63 Q60 69 68 63" stroke="#2d4a42" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- ほっぺ -->
      <circle cx="43" cy="58" r="6" fill="#ff9eb5" opacity="0.4"/>
      <circle cx="77" cy="58" r="6" fill="#ff9eb5" opacity="0.4"/>
      <!-- 手 -->
      <ellipse cx="30" cy="88" rx="10" ry="8" fill="#3ecfaa" id="hand-l"/>
      <ellipse cx="90" cy="88" rx="10" ry="8" fill="#3ecfaa" id="hand-r"/>
    </svg>

    <div class="char-message" id="char-message">どれを出す？✨</div>

    <!-- スコア -->
    <div class="scoreboard">
      <div class="score-item">
        <div class="score-num" id="wins" style="color:#3ecfaa">0</div>
        <div class="score-label">WIN</div>
      </div>
      <div class="score-item">
        <div class="score-num" id="draws" style="color:#f59e0b">0</div>
        <div class="score-label">DRAW</div>
      </div>
      <div class="score-item">
        <div class="score-num" id="losses" style="color:#ff7f7f">0</div>
        <div class="score-label">LOSE</div>
      </div>
    </div>
  </div>

  <!-- 対戦エリア -->
  <div class="battle-card">
    <div class="battle-side">
      <div class="battle-label">YOU</div>
      <div class="battle-hand" id="player-hand">❓</div>
    </div>
    <div class="vs-badge">VS</div>
    <div class="battle-side">
      <div class="battle-label">CPU</div>
      <div class="battle-hand" id="cpu-hand">❓</div>
    </div>
  </div>

  <!-- 選択ボタン -->
  <div class="choices-card">
    <div class="choices-label">SELECT YOUR MOVE</div>
    <div class="choices">
      <button class="choice-btn" onclick="play('rock')">
        ✊<span class="label">グー</span>
      </button>
      <button class="choice-btn" onclick="play('scissors')">
        ✌️<span class="label">チョキ</span>
      </button>
      <button class="choice-btn" onclick="play('paper')">
        ✋<span class="label">パー</span>
      </button>
    </div>
  </div>

  <button class="reset-btn" onclick="reset()">↺ スコアをリセット</button>

</div>

<script>
  const HANDS = {
    rock:     { emoji: '✊', label: 'グー' },
    scissors: { emoji: '✌️', label: 'チョキ' },
    paper:    { emoji: '✋', label: 'パー' },
  };
  const WINS_AGAINST = { rock: 'scissors', scissors: 'paper', paper: 'rock' };
  const keys = Object.keys(HANDS);

  let wins = 0, draws = 0, losses = 0;

  const messages = {
    win:  ['やったー！🎉', 'さいこう！✨', 'つよい！🌟', 'かんぺき！🥳'],
    lose: ['くやしい…😢', 'まけた…💦',  'つぎはかつよ！💪', 'うーん…😅'],
    draw: ['あいこだよ！🤝', 'おなじだね！😊', 'もういっかい！✨'],
    idle: ['どれを出す？✨', 'ファイト！💪', 'いくよ！🌿'],
  };

  function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function setFace(type) {
    const mouth = document.getElementById('mouth');
    const eyeL  = document.getElementById('eye-l');
    const eyeR  = document.getElementById('eye-r');
    if (type === 'win') {
      mouth.setAttribute('d', 'M50 62 Q60 71 70 62');
      eyeL.setAttribute('cy', '51'); eyeR.setAttribute('cy', '51');
    } else if (type === 'lose') {
      mouth.setAttribute('d', 'M52 67 Q60 61 68 67');
      eyeL.setAttribute('cy', '49'); eyeR.setAttribute('cy', '49');
    } else if (type === 'draw') {
      mouth.setAttribute('d', 'M52 64 Q60 64 68 64');
      eyeL.setAttribute('cy', '50'); eyeR.setAttribute('cy', '50');
    } else {
      mouth.setAttribute('d', 'M52 63 Q60 69 68 63');
      eyeL.setAttribute('cy', '50'); eyeR.setAttribute('cy', '50');
    }
  }

  function play(playerChoice) {
    const cpuChoice   = keys[Math.floor(Math.random() * 3)];
    const playerHand  = document.getElementById('player-hand');
    const cpuHand     = document.getElementById('cpu-hand');
    const charMsg     = document.getElementById('char-message');
    const char        = document.getElementById('char');

    playerHand.classList.remove('shake');
    cpuHand.classList.remove('shake');
    char.classList.remove('bounce', 'shake-lose');
    void playerHand.offsetWidth;

    playerHand.textContent = '🤜';
    cpuHand.textContent    = '🤛';
    playerHand.classList.add('shake');
    cpuHand.classList.add('shake');
    charMsg.className = 'char-message';
    charMsg.textContent = 'じゃん…けん…ぽん！';

    setTimeout(() => {
      playerHand.textContent = HANDS[playerChoice].emoji;
      cpuHand.textContent    = HANDS[cpuChoice].emoji;

      let type;
      if (playerChoice === cpuChoice) {
        type = 'draw'; draws++;
        document.getElementById('draws').textContent = draws;
        char.classList.add('bounce');
      } else if (WINS_AGAINST[playerChoice] === cpuChoice) {
        type = 'win'; wins++;
        document.getElementById('wins').textContent = wins;
        char.classList.add('bounce');
      } else {
        type = 'lose'; losses++;
        document.getElementById('losses').textContent = losses;
        char.classList.add('shake-lose');
      }

      setFace(type);
      charMsg.className = 'char-message ' + type;
      charMsg.textContent = rand(messages[type]);
    }, 500);
  }

  function reset() {
    wins = draws = losses = 0;
    document.getElementById('wins').textContent   = 0;
    document.getElementById('draws').textContent  = 0;
    document.getElementById('losses').textContent = 0;
    document.getElementById('player-hand').textContent = '❓';
    document.getElementById('cpu-hand').textContent    = '❓';
    const charMsg = document.getElementById('char-message');
    charMsg.className = 'char-message';
    charMsg.textContent = rand(messages.idle);
    setFace('idle');
    document.getElementById('char').classList.remove('bounce', 'shake-lose');
  }
</script>
</body>
</html>
